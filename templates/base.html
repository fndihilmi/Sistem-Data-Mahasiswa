<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Data Mahasiswa{% endblock %}</title>
  <style>
    :root { --primary:#1d4ed8; --danger:#dc2626; --ok:#15803d; --bg:#f3f4f6; --border:#d1d5db; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; color: #111827; }
    header { background: var(--primary); color: #fff; padding: 16px 24px; }
    header a { color: #fff; text-decoration: none; font-weight: 700; font-size: 1.25rem; }
    main { max-width: 960px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 10px; padding: 20px 24px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    h1 { margin-top: 0; font-size: 1.4rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: #f9fafb; font-size: .85rem; text-transform: uppercase; letter-spacing: .03em; }
    .btn { display: inline-block; padding: 7px 14px; border-radius: 6px; border: none; cursor: pointer;
           background: var(--primary); color: #fff; text-decoration: none; font-size: .9rem; }
    .btn-sm { padding: 4px 10px; font-size: .8rem; }
    .btn-gray { background: #6b7280; }
    .btn-danger { background: var(--danger); }
    .actions { display: flex; gap: 6px; align-items: center; }
    .actions form { margin: 0; }
    .toolbar { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .toolbar form { display: flex; gap: 6px; }
    input[type=text], input[type=number], input[type=search] {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; }
    .toolbar input[type=search] { width: 220px; }
    label { display: block; font-weight: 600; margin: 14px 0 4px; }
    input[readonly] { background: #e5e7eb; }
    .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 10px; }
    .flash.error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .flash.success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .empty { text-align: center; color: #6b7280; padding: 24px 0; }
    dl { display: grid; grid-template-columns: 160px 1fr; gap: 8px 12px; }
    dt { font-weight: 600; color: #374151; }
    dd { margin: 0; }
    .hint { font-size: .8rem; color: #6b7280; }
  </style>
</head>
<body>
  <header><a href="{{ url_for('index') }}">📚 Sistem Data Mahasiswa</a></header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
