{% extends "base.html" %}
{% block title %}{{ "Tambah" if mode == "tambah" else "Edit" }} Mahasiswa{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ "Tambah Mahasiswa Baru" if mode == "tambah" else "Edit Data Mahasiswa" }}</h1>

  <form method="post" novalidate>
    <label for="nim">NIM</label>
    <input type="text" id="nim" name="nim" inputmode="numeric"
           value="{{ data.get('nim', '') }}" {{ "readonly" if mode == "edit" }}>
    {% if mode == "edit" %}<div class="hint">NIM tidak dapat diubah.</div>{% endif %}

    <label for="nama">Nama</label>
    <input type="text" id="nama" name="nama" value="{{ data.get('nama', '') }}">

    <label for="program_studi">Program Studi</label>
    <input type="text" id="program_studi" name="program_studi"
           value="{{ data.get('program_studi', '') }}">

    <label for="angkatan">Angkatan</label>
    <input type="text" id="angkatan" name="angkatan" inputmode="numeric"
           value="{{ data.get('angkatan', '') }}" placeholder="contoh: 2023">

    <label for="ipk">IPK</label>
    <input type="text" id="ipk" name="ipk" inputmode="decimal"
           value="{{ data.get('ipk', '') }}" placeholder="0.00 - 4.00">

    <p>
      <button class="btn" type="submit">Simpan</button>
      <a class="btn btn-gray" href="{{ url_for('index') }}">Batal</a>
    </p>
  </form>
</div>
{% endblock %}
